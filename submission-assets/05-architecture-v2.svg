<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">BarkPass system architecture</title>
  <desc id="desc">A vertical architecture map showing an owner choosing a dog photo in the browser, Vercel Functions calling Gemini, ElevenLabs, Snowflake and Solana, and the same dog ID linking observation, voice, history and passport proof.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2A2723" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#C65E43"/>
    </marker>
  </defs>

  <rect width="1000" height="1200" fill="#F8F5EE"/>
  <circle cx="904" cy="82" r="190" fill="#EFE1D5" opacity="0.78"/>
  <circle cx="82" cy="1136" r="170" fill="#DEE7E1" opacity="0.72"/>

  <rect x="64" y="56" width="230" height="42" rx="21" fill="#EAD8CA"/>
  <text x="179" y="84" text-anchor="middle" fill="#93432F" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">BARKPASS SYSTEM MAP</text>
  <text x="64" y="160" fill="#27231F" font-family="Georgia, serif" font-size="56" font-weight="700">One check-in. Four clear jobs.</text>
  <text x="66" y="204" fill="#665F58" font-family="Arial, sans-serif" font-size="24">One dog ID connects observation → voice → history → portable proof.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="248" width="872" height="148" rx="30" fill="#FFFDF8" stroke="#D8D0C6" stroke-width="2"/>
  </g>
  <rect x="94" y="278" width="86" height="86" rx="26" fill="#C65E43"/>
  <path d="M115 326c11-22 29-22 40 0M115 326c-11-13-21-3-11 11 6 7 13 10 19 11M155 326c11-13 21-3 11 11-6 7-13 10-19 11" fill="none" stroke="#FFF8F0" stroke-width="6" stroke-linecap="round"/>
  <text x="208" y="300" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">OWNER’S BROWSER</text>
  <text x="208" y="340" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">Choose today’s dog photo</text>
  <text x="208" y="373" fill="#665F58" font-family="Arial, sans-serif" font-size="21">Profile + prepared JPEG frame + labelled local resilience</text>
  <rect x="724" y="286" width="180" height="72" rx="20" fill="#F1E5DA"/>
  <text x="814" y="316" text-anchor="middle" fill="#93432F" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">PRIVATE INPUT</text>
  <text x="814" y="342" text-anchor="middle" fill="#27231F" font-family="Arial, sans-serif" font-size="18" font-weight="700">Owner initiates</text>

  <path d="M500 405 V445" stroke="#C65E43" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="64" y="458" width="872" height="608" rx="38" fill="#292724"/>
  <text x="104" y="510" fill="#FFF9F1" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">VERCEL FUNCTIONS</text>
  <text x="896" y="510" text-anchor="end" fill="#E6D9CF" font-family="Arial, sans-serif" font-size="19">Provider credentials stay server-side</text>

  <g filter="url(#shadow)">
    <rect x="96" y="544" width="808" height="108" rx="24" fill="#FFFDF8"/>
    <rect x="96" y="674" width="808" height="108" rx="24" fill="#FFFDF8"/>
    <rect x="96" y="804" width="808" height="108" rx="24" fill="#FFFDF8"/>
    <rect x="96" y="934" width="808" height="108" rx="24" fill="#FFFDF8"/>
  </g>

  <rect x="96" y="544" width="14" height="108" rx="7" fill="#769A84"/>
  <circle cx="148" cy="598" r="26" fill="#DEE8E1"/>
  <text x="148" y="607" text-anchor="middle" fill="#3F6650" font-family="Arial, sans-serif" font-size="23" font-weight="700">1</text>
  <text x="192" y="588" fill="#27231F" font-family="Georgia, serif" font-size="36" font-weight="700">Gemini</text>
  <text x="194" y="622" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">NOTICE</text>
  <text x="485" y="586" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Mood · energy · posture</text>
  <text x="485" y="620" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Structured visible signals + confidence</text>

  <path d="M500 654 V669" stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="96" y="674" width="14" height="108" rx="7" fill="#C65E43"/>
  <circle cx="148" cy="728" r="26" fill="#F1E4D9"/>
  <text x="148" y="737" text-anchor="middle" fill="#93432F" font-family="Arial, sans-serif" font-size="23" font-weight="700">2</text>
  <text x="192" y="718" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">ElevenLabs</text>
  <text x="194" y="752" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">HEAR</text>
  <text x="485" y="716" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">First-person MP3</text>
  <text x="485" y="750" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Only the derived sentence is spoken</text>

  <path d="M500 784 V799" stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="96" y="804" width="14" height="108" rx="7" fill="#6F87A0"/>
  <circle cx="148" cy="858" r="26" fill="#E3E9F0"/>
  <text x="148" y="867" text-anchor="middle" fill="#405A73" font-family="Arial, sans-serif" font-size="23" font-weight="700">3</text>
  <text x="192" y="848" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">Snowflake</text>
  <text x="194" y="882" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">REMEMBER</text>
  <text x="485" y="846" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Dog-scoped history</text>
  <text x="485" y="880" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Idempotent rows → grounded trend facts</text>

  <path d="M500 914 V929" stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="96" y="934" width="14" height="108" rx="7" fill="#87759E"/>
  <circle cx="148" cy="988" r="26" fill="#E9E3EF"/>
  <text x="148" y="997" text-anchor="middle" fill="#625378" font-family="Arial, sans-serif" font-size="23" font-weight="700">4</text>
  <text x="192" y="978" fill="#27231F" font-family="Georgia, serif" font-size="36" font-weight="700">Solana</text>
  <text x="194" y="1012" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">CARRY</text>
  <text x="485" y="976" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Devnet passport</text>
  <text x="485" y="1010" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Explorer proof · Phantom approves tips</text>

  <rect x="64" y="1092" width="872" height="72" rx="24" fill="#FFFDF8" stroke="#D8D0C6" stroke-width="2"/>
  <circle cx="106" cy="1128" r="17" fill="#C65E43"/>
  <path d="M99 1128l5 6 10-13" fill="none" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="1121" fill="#27231F" font-family="Arial, sans-serif" font-size="21" font-weight="700">Same dog_id, end to end.</text>
  <text x="140" y="1148" fill="#665F58" font-family="Arial, sans-serif" font-size="18">Original photo stays private · every fallback is labelled · public proof is devnet only</text>
</svg>
