<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" aria-labelledby="title desc" role="img" viewBox="0 0 1000 1200"><title id="title">BarkPass system architecture</title><desc id="desc">A vertical architecture map showing an owner choosing a dog photo in the browser, Vercel Functions calling Gemini, ElevenLabs, Snowflake and Solana, and the same dog ID linking observation, voice, history and passport proof.</desc><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#2A2723" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="6" viewBox="0 0 12 12"><path fill="#C65E43" d="M1 1 L11 6 L1 11 Z"/></marker></defs><rect width="1000" height="1200" fill="#F8F5EE"/><circle cx="904" cy="82" r="190" fill="#EFE1D5" opacity=".78"/><circle cx="82" cy="1136" r="170" fill="#DEE7E1" opacity=".72"/><rect width="230" height="42" x="64" y="56" fill="#EAD8CA" rx="21"/><text x="179" y="84" fill="#93432F" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">BARKPASS SYSTEM MAP</text><text x="64" y="160" fill="#27231F" font-family="Georgia, serif" font-size="56" font-weight="700">One check-in. Four clear jobs.</text><text x="66" y="204" fill="#665F58" font-family="Arial, sans-serif" font-size="24">One dog ID connects observation → voice → history → portable proof.</text><g filter="url(#shadow)"><rect width="872" height="148" x="64" y="248" fill="#FFFDF8" stroke="#D8D0C6" stroke-width="2" rx="30"/></g><rect width="86" height="86" x="94" y="278" fill="#C65E43" rx="26"/><path fill="none" stroke="#FFF8F0" stroke-linecap="round" stroke-width="6" d="M115 326c11-22 29-22 40 0M115 326c-11-13-21-3-11 11 6 7 13 10 19 11M155 326c11-13 21-3 11 11-6 7-13 10-19 11"/><text x="208" y="300" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">OWNER’S BROWSER</text><text x="208" y="340" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">Choose today’s dog photo</text><text x="208" y="373" fill="#665F58" font-family="Arial, sans-serif" font-size="21">Profile + prepared JPEG frame + labelled local resilience</text><rect width="180" height="72" x="724" y="286" fill="#F1E5DA" rx="20"/><text x="814" y="316" fill="#93432F" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">PRIVATE INPUT</text><text x="814" y="342" fill="#27231F" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Owner initiates</text><path stroke="#C65E43" stroke-width="5" marker-end="url(#arrow)" d="M500 405 V445"/><rect width="872" height="608" x="64" y="458" fill="#292724" rx="38"/><text x="104" y="510" fill="#FFF9F1" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">VERCEL FUNCTIONS</text><text x="896" y="510" fill="#E6D9CF" font-family="Arial, sans-serif" font-size="19" text-anchor="end">Provider credentials stay server-side</text><g filter="url(#shadow)"><rect width="808" height="108" x="96" y="544" fill="#FFFDF8" rx="24"/><rect width="808" height="108" x="96" y="674" fill="#FFFDF8" rx="24"/><rect width="808" height="108" x="96" y="804" fill="#FFFDF8" rx="24"/><rect width="808" height="108" x="96" y="934" fill="#FFFDF8" rx="24"/></g><rect width="14" height="108" x="96" y="544" fill="#769A84" rx="7"/><circle cx="148" cy="598" r="26" fill="#DEE8E1"/><text x="148" y="607" fill="#3F6650" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text><text x="192" y="588" fill="#27231F" font-family="Georgia, serif" font-size="36" font-weight="700">Gemini</text><text x="194" y="622" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">NOTICE</text><text x="485" y="586" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Mood · energy · posture</text><text x="485" y="620" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Structured visible signals + confidence</text><path stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)" d="M500 654 V669"/><rect width="14" height="108" x="96" y="674" fill="#C65E43" rx="7"/><circle cx="148" cy="728" r="26" fill="#F1E4D9"/><text x="148" y="737" fill="#93432F" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text><text x="192" y="718" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">ElevenLabs</text><text x="194" y="752" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">HEAR</text><text x="485" y="716" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">First-person MP3</text><text x="485" y="750" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Only the derived sentence is spoken</text><path stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)" d="M500 784 V799"/><rect width="14" height="108" x="96" y="804" fill="#6F87A0" rx="7"/><circle cx="148" cy="858" r="26" fill="#E3E9F0"/><text x="148" y="867" fill="#405A73" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text><text x="192" y="848" fill="#27231F" font-family="Georgia, serif" font-size="34" font-weight="700">Snowflake</text><text x="194" y="882" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">REMEMBER</text><text x="485" y="846" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Dog-scoped history</text><text x="485" y="880" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Idempotent rows → grounded trend facts</text><path stroke="#C65E43" stroke-width="4" marker-end="url(#arrow)" d="M500 914 V929"/><rect width="14" height="108" x="96" y="934" fill="#87759E" rx="7"/><circle cx="148" cy="988" r="26" fill="#E9E3EF"/><text x="148" y="997" fill="#625378" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">4</text><text x="192" y="978" fill="#27231F" font-family="Georgia, serif" font-size="36" font-weight="700">Solana</text><text x="194" y="1012" fill="#A24B36" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">CARRY</text><text x="485" y="976" fill="#27231F" font-family="Arial, sans-serif" font-size="25" font-weight="700">Devnet passport</text><text x="485" y="1010" fill="#665F58" font-family="Arial, sans-serif" font-size="20">Explorer proof · Phantom approves tips</text><rect width="872" height="72" x="64" y="1092" fill="#FFFDF8" stroke="#D8D0C6" stroke-width="2" rx="24"/><circle cx="106" cy="1128" r="17" fill="#C65E43"/><path fill="none" stroke="#FFFDF8" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M99 1128l5 6 10-13"/><text x="140" y="1121" fill="#27231F" font-family="Arial, sans-serif" font-size="21" font-weight="700">Same dog_id, end to end.</text><text x="140" y="1148" fill="#665F58" font-family="Arial, sans-serif" font-size="18">Original photo stays private · every fallback is labelled · public proof is devnet only</text></svg>